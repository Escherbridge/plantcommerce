name: Deployment build

on:
  pull_request:
  push:
    branches: [main, codex/aevani-railway-release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plantapp
    env:
      PUBLIC_BASE_URL: https://aevani.example
      AUTH_CAPABILITIES_ENABLED: "false"
      AUTH_ATOMIC_THROTTLES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: plantapp/package-lock.json
      - run: npm ci
      - run: npm run build
